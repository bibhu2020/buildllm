[project]
name = "buildllm"
version = "0.1.0"
description = "Build LLM from Scratch"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Core ML
    "torch>=2.9.0",
    "tensorflow>=2.15.0",
    "tqdm>4.66", #used for showing progress bar.

    # Hugging Face ecosystem
    "transformers>=4.57.3",
    "datasets>=4.4.1",
    "evaluate>=0.4.6",
    "peft>=0.18.0",
    "tiktoken>=0.12.0",
    "bitsandbytes>=0.48.2",

    # Data / Analysis
    "pandas>=2.3.3",
    "scikit-learn>=1.7.2",
    "matplotlib>=3.10.7",

    # Utilities
    "python-dotenv>=1.0.1",

    "huggingface_hub",
    "transformers",
    "tokenizers",
    "accelerate",
    "sentencepiece",
    "PyMuPDF",
    "tf-keras",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "ipywidgets>=8.1.5",
]
